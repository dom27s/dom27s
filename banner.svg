<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="DOM27S personal build log. Robotics, embedded, 3D fabrication, CAD. Status online.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a21"/>
      <stop offset="1" stop-color="#02060a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39d5ff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="14" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="14" fill="url(#grid)"/>

  <!-- frame + corner brackets -->
  <rect x="18" y="18" width="1564" height="384" rx="6" fill="none" stroke="#ffb000" stroke-opacity="0.28" stroke-width="2"/>
  <g fill="none" stroke="#ffb000" stroke-width="5">
    <path d="M18 70V18h52M1530 18h52v52M1582 350v52h-52M70 402H18v-52"/>
  </g>

  <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <!-- header strip -->
    <rect x="18" y="18" width="1564" height="46" fill="#ffb000" fill-opacity="0.1"/>
    <text x="48" y="49" font-size="20" font-weight="600" fill="#ffb000" letter-spacing="4">DEEP FIELD WORKSHOP  ::  OPERATOR CONSOLE  ::  SOL-3</text>
    <text x="1552" y="49" font-size="20" font-weight="600" fill="#39d5ff" letter-spacing="4" text-anchor="end">LINK STABLE</text>

    <!-- title -->
    <text x="48" y="190" font-size="124" font-weight="800" fill="#ffb000" filter="url(#glow)" letter-spacing="6">DOM27S</text>
    <text x="52" y="238" font-size="28" font-weight="600" fill="#39d5ff" letter-spacing="8">// PERSONAL BUILD LOG</text>

    <!-- readout -->
    <g font-size="22" font-weight="500" letter-spacing="3">
      <text x="52" y="304" fill="#8fb4c2">SYSTEMS&#160;&#160;<tspan fill="#e6f3f7">ROBOTICS · EMBEDDED · 3D FABRICATION · CAD</tspan></text>
      <text x="52" y="344" fill="#8fb4c2" textLength="424" lengthAdjust="spacing">STATUS&#160;&#160;&#160;<tspan fill="#5dfc9a">ONLINE</tspan><tspan fill="#8fb4c2">  /  BUILDING</tspan></text>
    </g>
    <rect x="490" y="323" width="14" height="24" fill="#ffb000">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- orbital plot -->
  <g transform="translate(1310 236)" fill="none">
    <g filter="url(#soft)">
      <ellipse rx="190" ry="68" stroke="#39d5ff" stroke-width="2.5" transform="rotate(-18)"/>
      <ellipse rx="128" ry="46" stroke="#39d5ff" stroke-opacity="0.6" stroke-width="2" transform="rotate(-18)"/>
      <ellipse rx="70" ry="25" stroke="#39d5ff" stroke-opacity="0.4" stroke-width="2" transform="rotate(-18)"/>
    </g>
    <circle r="15" fill="#ffb000" filter="url(#glow)"/>
    <g transform="rotate(-18)">
      <circle r="8" fill="#e6f3f7">
        <animateMotion dur="14s" repeatCount="indefinite" path="M190 0A190 68 0 1 1 -190 0A190 68 0 1 1 190 0"/>
      </circle>
      <circle r="6" fill="#5dfc9a">
        <animateMotion dur="8s" repeatCount="indefinite" path="M-128 0A128 46 0 1 1 128 0A128 46 0 1 1 -128 0"/>
      </circle>
    </g>
    <g stroke="#ffb000" stroke-opacity="0.5" stroke-width="2">
      <path d="M-230 0h-22M230 0h22M0 -120v-18M0 120v18"/>
    </g>
  </g>

  <rect width="1600" height="420" rx="14" fill="url(#scan)"/>
</svg>
